name: Preview on Firebase Hosting

# Every pull request gets its own throw-away preview URL
# (https://mindori-invoices--pr<N>-<hash>.web.app) so a change can be tried with
# real login and real data before anything reaches the live site. The URL is
# posted as a comment on the PR. The live site only changes on merge to main
# (see firebase-hosting.yml).

on:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mindori-invoices
          expires: 30d
